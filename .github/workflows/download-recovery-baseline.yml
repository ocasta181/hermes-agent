name: Desktop recovery candidate checks
on:
  push:
    branches: ['validation/download-recovery-baseline-20261019']
permissions:
  contents: read
env:
  PYTHON_CPU_COUNT: '2'
  RAYON_NUM_THREADS: '2'
  NODE_OPTIONS: '--max-old-space-size=4096'
defaults:
  run:
    shell: bash
jobs:
  desktop:
    name: Required desktop checks at ab8385caa9
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ab8385caa9484993e1aaaa28e438c9cbd50ffc0e
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
      - name: Install the locked workspaces
        run: npm ci
      - name: Record candidate source
        run: |
          mkdir -p "$RUNNER_TEMP/desktop-followup"
          git rev-parse HEAD > "$RUNNER_TEMP/desktop-followup/revision.txt"
          test "$(git rev-parse HEAD)" = ab8385caa9484993e1aaaa28e438c9cbd50ffc0e
      - name: Run required desktop type and lint checks
        timeout-minutes: 5
        run: npm run check:lint --workspace apps/desktop 2>&1 | tee "$RUNNER_TEMP/desktop-followup/lint.log"
      - name: Run the complete required desktop UI unit suite
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: npm run test:ui --workspace apps/desktop -- --maxWorkers=2 2>&1 | tee "$RUNNER_TEMP/desktop-followup/ui.log"
      - name: Check source custody
        if: ${{ !cancelled() }}
        run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: recovery-desktop-ab8385caa9
          path: ${{ runner.temp }}/desktop-followup
          retention-days: 7

