name: Desktop workspace recovery follow-up
on:
  push:
    branches: ['validation/download-recovery-baseline-20261019']
permissions:
  contents: read
env:
  PYTHON_CPU_COUNT: '2'
  RAYON_NUM_THREADS: '2'
  NODE_OPTIONS: '--max-old-space-size=4096'
defaults:
  run:
    shell: bash
jobs:
  electron:
    name: Desktop Electron checks (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: main-focused
            revision: '2e83e2a935ee04f606aab58e498d34ca58d84c07'
            scope: focused
          - label: candidate-full
            revision: '33e72bd67bfd30857c70ac5af9a432943b95e1db'
            scope: full
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ matrix.revision }}
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
          test-environment: 'true'
      - name: Install the same display dependencies as the full workspace run
        run: sudo apt-get update && sudo apt-get install -y zsh xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2t64
      - name: Install the locked workspaces
        run: npm ci
      - name: Check catalog and portal behavior without competing Electron workers
        timeout-minutes: 15
        env:
          CHECK_SCOPE: ${{ matrix.scope }}
        run: |
          mkdir -p "$RUNNER_TEMP/electron-followup"
          git rev-parse HEAD > "$RUNNER_TEMP/electron-followup/revision.txt"
          if [[ "$CHECK_SCOPE" == full ]]; then
            xvfb-run -a npm run test:desktop:platforms --workspace apps/desktop -- --maxWorkers=1 2>&1 | tee "$RUNNER_TEMP/electron-followup/results.log"
          else
            cd apps/desktop
            xvfb-run -a node ../../node_modules/vitest/vitest.mjs run --project electron --maxWorkers=1 scripts/i18n-keys.test.mjs electron/portal-session-live.test.ts 2>&1 | tee "$RUNNER_TEMP/electron-followup/results.log"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: recovery-electron-${{ matrix.label }}
          path: ${{ runner.temp }}/electron-followup
          retention-days: 7

