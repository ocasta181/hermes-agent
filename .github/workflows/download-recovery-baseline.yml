name: Portal fixture environment comparison
on:
  push:
    branches: ['validation/download-recovery-baseline-20261019']
permissions:
  contents: read
env:
  PYTHON_CPU_COUNT: '2'
  RAYON_NUM_THREADS: '2'
  NODE_OPTIONS: '--max-old-space-size=4096'
defaults:
  run:
    shell: bash
jobs:
  portal_environment:
    name: Unchanged main portal fixture with isolated HOME comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          extras: '[]'
          test-environment: 'true'
      - name: Install display dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2t64
      - name: Prepare unchanged main and its locked workspaces
        run: |
          git fetch --no-tags --depth=1 origin 2e83e2a935ee04f606aab58e498d34ca58d84c07
          git worktree add --detach "$RUNNER_TEMP/portal-source" 2e83e2a935ee04f606aab58e498d34ca58d84c07
          cd "$RUNNER_TEMP/portal-source"
          npm ci
      - name: Run the existing fixture with each environment
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/portal-env-evidence"
          xvfb-run -a node .review/portal-probe.mjs "$RUNNER_TEMP/portal-source" "$RUNNER_TEMP/portal-env-evidence" 2>&1 | tee "$RUNNER_TEMP/portal-env-evidence/probe.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: portal-environment-comparison
          path: ${{ runner.temp }}/portal-env-evidence
          retention-days: 7

