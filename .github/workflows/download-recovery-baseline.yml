name: Session schema timeout repair validation
on:
  push:
    branches: ['validation/download-recovery-baseline-20261019']
permissions:
  contents: read
env:
  PYTHON_CPU_COUNT: '2'
  RAYON_NUM_THREADS: '2'
  NODE_OPTIONS: '--max-old-space-size=4096'
defaults:
  run:
    shell: bash
jobs:
  browse:
    name: Session schema timeout repair (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: ./.github/actions/setup-pm
        with:
          packages: ripgrep
          extras: '["all", "telegram", "anthropic", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
          prune-python-cache: true
      - name: Check the affected schema-recovery test file
        timeout-minutes: 5
        env:
          HERMES_TEST_WORKERS: '1'
          HERMES_TEST_FILE_TIMEOUT: '240'
        run: |
          mkdir -p "$RUNNER_TEMP/baseline-comparison"
          git rev-parse HEAD > "$RUNNER_TEMP/baseline-comparison/revision.txt"
          /bin/bash scripts/run_tests.sh --files tests/hermes_cli/test_browse_schema_drift.py -- -v --tb=short 2>&1 | tee "$RUNNER_TEMP/baseline-comparison/result.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: browse-repair-${{ matrix.os }}
          path: ${{ runner.temp }}/baseline-comparison
          retention-days: 7

