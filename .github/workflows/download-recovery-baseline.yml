name: Download recovery baseline comparison
on:
  push:
    branches: ['validation/download-recovery-baseline-20261019']
permissions:
  contents: read
env:
  PYTHON_CPU_COUNT: '2'
  RAYON_NUM_THREADS: '2'
  NODE_OPTIONS: '--max-old-space-size=4096'
defaults:
  run:
    shell: bash
jobs:
  browse:
    name: macOS session schema comparison (${{ matrix.label }})
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: main
            revision: '2e83e2a935ee04f606aab58e498d34ca58d84c07'
          - label: candidate
            revision: '41ac23398b91d36b83a36c16489893735d13ddde'
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ matrix.revision }}
      - uses: ./.github/actions/setup-pm
        with:
          packages: ripgrep
          extras: '["all", "telegram", "anthropic", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
          prune-python-cache: true
      - name: Reproduce the isolated schema-recovery failure
        timeout-minutes: 5
        env:
          HERMES_TEST_WORKERS: '1'
          HERMES_TEST_FILE_TIMEOUT: '120'
        run: |
          mkdir -p "$RUNNER_TEMP/baseline-comparison"
          git rev-parse HEAD > "$RUNNER_TEMP/baseline-comparison/revision.txt"
          /bin/bash scripts/run_tests.sh --files tests/hermes_cli/test_browse_schema_drift.py -- -k test_slow_browse_reconcile_gives_up_inside_its_budget_and_boot_waits_it_out -v --tb=short 2>&1 | tee "$RUNNER_TEMP/baseline-comparison/result.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: browse-comparison-${{ matrix.label }}
          path: ${{ runner.temp }}/baseline-comparison
          retention-days: 7

