name: Windows Git baseline diagnosis
on:
  push:
    branches: ['validation/download-recovery-baseline-20261019']
permissions:
  contents: read
env:
  PYTHON_CPU_COUNT: '2'
  RAYON_NUM_THREADS: '2'
defaults:
  run:
    shell: bash
jobs:
  windows_git:
    name: Windows Git tests on unchanged main
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: '2e83e2a935ee04f606aab58e498d34ca58d84c07'
      - uses: ./.github/actions/setup-pm
        with:
          packages: git,ripgrep
          extras: '["all", "telegram", "anthropic", "mistral", "fal", "modal", "daytona", "parallel-web"]'
          test-environment: 'true'
          prune-python-cache: true
      - name: Record installed Git layouts
        run: |
          mkdir -p "$RUNNER_TEMP/git-baseline"
          git rev-parse HEAD > "$RUNNER_TEMP/git-baseline/revision.txt"
          "$HERMES_PYTHON" - <<'PY' | tee "$RUNNER_TEMP/git-baseline/git-layout.json"
          import json, pathlib, shutil, subprocess
          locations = ["mingw64/libexec/git-core/git.exe", "mingw64/bin/git.exe", "cmd/git.exe", "bin/git.exe"]
          rows = []
          for relative in locations:
              path = pathlib.Path("C:/Program Files/Git") / relative
              row = {"path": str(path), "exists": path.exists()}
              if path.exists():
                  probe = subprocess.run([str(path), "--version"], capture_output=True, text=True, timeout=15)
                  row.update(returncode=probe.returncode, stdout=probe.stdout.strip(), stderr=probe.stderr.strip())
              rows.append(row)
          print(json.dumps({"path_git": shutil.which("git"), "installed": rows}, indent=2))
          PY
      - name: Check the same five live Git cases on main
        timeout-minutes: 5
        env:
          HERMES_TEST_WORKERS: '1'
          HERMES_TEST_FILE_TIMEOUT: '120'
        run: |
          /bin/bash scripts/run_tests.sh --files tests/hermes_cli/test_git_trampoline_windows_live.py -- -v --tb=short 2>&1 | tee "$RUNNER_TEMP/git-baseline/result.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-git-baseline
          path: ${{ runner.temp }}/git-baseline
          retention-days: 7

