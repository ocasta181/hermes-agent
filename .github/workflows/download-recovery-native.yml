name: Native download recovery UI validation
on:
  push:
    branches: [validation/download-recovery-ui-20261019]
permissions:
  contents: read
env:
  RECOVERY_SOURCE_COMMIT: ab8385caa9484993e1aaaa28e438c9cbd50ffc0e
  RECOVERY_EXPECTED_BUILD: ab8385caa9484993e1aaaa28e438c9cbd50ffc0e
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  PYTHON_CPU_COUNT: '2'
  RAYON_NUM_THREADS: '2'
  NODE_OPTIONS: --max-old-space-size=4096
defaults:
  run:
    shell: bash
jobs:
  native:
    name: Built UI on ${{ matrix.os }}
    if: github.repository == 'ocasta181/hermes-agent'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    steps:
    - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      with:
        fetch-depth: 3
    - uses: ./.github/actions/setup-pm
      with:
        toolchain: all
    - name: Verify the certificate tool before building
      run: |
        recovery_openssl="$(command -v openssl)"
        if [[ "$RUNNER_OS" == Windows ]]; then recovery_openssl="$(cygpath -w "$recovery_openssl")"; fi
        printf 'RECOVERY_OPENSSL=%s\n' "$recovery_openssl" >> "$GITHUB_ENV"
        RECOVERY_OPENSSL="$recovery_openssl" node -e 'require("node:child_process").execFileSync(process.env.RECOVERY_OPENSSL,["version"],{stdio:"inherit"})'
    - name: Install Linux display dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
    - name: Create a clean checkout of the candidate
      run: |
        git fetch --no-tags --depth=1 origin "$RECOVERY_SOURCE_COMMIT"
        git worktree add --detach "$RUNNER_TEMP/recovery-source" "$RECOVERY_SOURCE_COMMIT"
    - name: Restore the exact native app build
      id: app
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/recovery-source/apps/desktop/release
        key: recovery-directory-v1-${{ matrix.os }}-${{ env.RECOVERY_SOURCE_COMMIT }}
    - name: Build the complete bundled app as an unpacked native app
      if: steps.app.outputs.cache-hit != 'true'
      id: build
      timeout-minutes: 50
      run: |
        mkdir -p "$RUNNER_TEMP/recovery-build"
        "$HERMES_PYTHON" .review/build_directory.py --source "$RUNNER_TEMP/recovery-source" 2>&1 | tee "$RUNNER_TEMP/recovery-build/build.log"
    - name: Save the built app before UI checks
      if: steps.build.outcome == 'success'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/recovery-source/apps/desktop/release
        key: recovery-directory-v1-${{ matrix.os }}-${{ env.RECOVERY_SOURCE_COMMIT }}
    - name: Install test tools when reusing a cached app
      if: steps.app.outputs.cache-hit == 'true'
      working-directory: ${{ runner.temp }}/recovery-source
      run: npm ci
    - name: Prepare verified model and engine inputs
      id: inputs
      run: |
        cd "$RUNNER_TEMP/recovery-source"
        "$HERMES_PYTHON" "$GITHUB_WORKSPACE/.review/prepare_runner.py"
        node -e 'require("fs").symlinkSync(process.argv[1],process.argv[2],"junction")' "$RUNNER_TEMP/recovery-source/node_modules" "$GITHUB_WORKSPACE/.review/node_modules"
    - name: Check engine Pause, app restart, Resume, and native inference
      if: ${{ !cancelled() && steps.inputs.outcome == 'success' }}
      timeout-minutes: 5
      run: |
        "$HERMES_PYTHON" .review/run.py --source "$RUNNER_TEMP/recovery-source" --evidence "$RUNNER_TEMP/recovery-evidence/engine-pause-resume" --inputs "$RUNNER_TEMP/recovery-source/.build/recovery-native-inputs" --case engine-pause-resume --prepared
    - name: Check Discard, completed-file preservation, and app restart
      if: ${{ !cancelled() && steps.inputs.outcome == 'success' }}
      timeout-minutes: 5
      run: |
        "$HERMES_PYTHON" .review/run.py --source "$RUNNER_TEMP/recovery-source" --evidence "$RUNNER_TEMP/recovery-evidence/engine-discard" --inputs "$RUNNER_TEMP/recovery-source/.build/recovery-native-inputs" --case engine-discard --prepared
    - name: Check TLS failure, app restart, model Resume, and native inference
      if: ${{ !cancelled() && steps.inputs.outcome == 'success' }}
      timeout-minutes: 5
      run: |
        "$HERMES_PYTHON" .review/run.py --source "$RUNNER_TEMP/recovery-source" --evidence "$RUNNER_TEMP/recovery-evidence/model-resume" --inputs "$RUNNER_TEMP/recovery-source/.build/recovery-native-inputs" --case model-resume --prepared
    - name: Prepare the nine localized control checks
      if: ${{ !cancelled() && runner.os == 'macOS' && steps.inputs.outcome == 'success' }}
      env:
        RECOVERY_SOURCE_ROOT: ${{ runner.temp }}/recovery-source
      run: node .review/prepare-locales.mjs
    - name: Check recovery controls in English
      if: ${{ !cancelled() && runner.os == 'macOS' && steps.inputs.outcome == 'success' }}
      timeout-minutes: 5
      run: |
        "$HERMES_PYTHON" .review/run.py --source "$RUNNER_TEMP/recovery-source" --evidence "$RUNNER_TEMP/recovery-evidence/locale-en" --inputs "$RUNNER_TEMP/recovery-source/.build/recovery-native-inputs" --case locale --locale en --prepared
    - name: Check recovery controls in Arabic
      if: ${{ !cancelled() && runner.os == 'macOS' && steps.inputs.outcome == 'success' }}
      timeout-minutes: 5
      run: |
        "$HERMES_PYTHON" .review/run.py --source "$RUNNER_TEMP/recovery-source" --evidence "$RUNNER_TEMP/recovery-evidence/locale-ar" --inputs "$RUNNER_TEMP/recovery-source/.build/recovery-native-inputs" --case locale --locale ar --prepared
    - name: Check recovery controls in Simplified Chinese
      if: ${{ !cancelled() && runner.os == 'macOS' && steps.inputs.outcome == 'success' }}
      timeout-minutes: 5
      run: |
        "$HERMES_PYTHON" .review/run.py --source "$RUNNER_TEMP/recovery-source" --evidence "$RUNNER_TEMP/recovery-evidence/locale-zh" --inputs "$RUNNER_TEMP/recovery-source/.build/recovery-native-inputs" --case locale --locale zh --prepared
    - name: Check recovery controls in Traditional Chinese
      if: ${{ !cancelled() && runner.os == 'macOS' && steps.inputs.outcome == 'success' }}
      timeout-minutes: 5
      run: |
        "$HERMES_PYTHON" .review/run.py --source "$RUNNER_TEMP/recovery-source" --evidence "$RUNNER_TEMP/recovery-evidence/locale-zh-hant" --inputs "$RUNNER_TEMP/recovery-source/.build/recovery-native-inputs" --case locale --locale zh-hant --prepared
    - name: Check recovery controls in Japanese
      if: ${{ !cancelled() && runner.os == 'macOS' && steps.inputs.outcome == 'success' }}
      timeout-minutes: 5
      run: |
        "$HERMES_PYTHON" .review/run.py --source "$RUNNER_TEMP/recovery-source" --evidence "$RUNNER_TEMP/recovery-evidence/locale-ja" --inputs "$RUNNER_TEMP/recovery-source/.build/recovery-native-inputs" --case locale --locale ja --prepared
    - name: Check recovery controls in Russian
      if: ${{ !cancelled() && runner.os == 'macOS' && steps.inputs.outcome == 'success' }}
      timeout-minutes: 5
      run: |
        "$HERMES_PYTHON" .review/run.py --source "$RUNNER_TEMP/recovery-source" --evidence "$RUNNER_TEMP/recovery-evidence/locale-ru" --inputs "$RUNNER_TEMP/recovery-source/.build/recovery-native-inputs" --case locale --locale ru --prepared
    - name: Check recovery controls in French
      if: ${{ !cancelled() && runner.os == 'macOS' && steps.inputs.outcome == 'success' }}
      timeout-minutes: 5
      run: |
        "$HERMES_PYTHON" .review/run.py --source "$RUNNER_TEMP/recovery-source" --evidence "$RUNNER_TEMP/recovery-evidence/locale-fr" --inputs "$RUNNER_TEMP/recovery-source/.build/recovery-native-inputs" --case locale --locale fr --prepared
    - name: Check recovery controls in German
      if: ${{ !cancelled() && runner.os == 'macOS' && steps.inputs.outcome == 'success' }}
      timeout-minutes: 5
      run: |
        "$HERMES_PYTHON" .review/run.py --source "$RUNNER_TEMP/recovery-source" --evidence "$RUNNER_TEMP/recovery-evidence/locale-de" --inputs "$RUNNER_TEMP/recovery-source/.build/recovery-native-inputs" --case locale --locale de --prepared
    - name: Check recovery controls in Spanish
      if: ${{ !cancelled() && runner.os == 'macOS' && steps.inputs.outcome == 'success' }}
      timeout-minutes: 5
      run: |
        "$HERMES_PYTHON" .review/run.py --source "$RUNNER_TEMP/recovery-source" --evidence "$RUNNER_TEMP/recovery-evidence/locale-es" --inputs "$RUNNER_TEMP/recovery-source/.build/recovery-native-inputs" --case locale --locale es --prepared
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: always()
      with:
        name: recovery-native-${{ runner.os }}
        path: |
          ${{ runner.temp }}/recovery-build
          ${{ runner.temp }}/recovery-evidence
        retention-days: 7
